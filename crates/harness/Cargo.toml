[package]
name = "comet-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comet-proto.workspace = true
base64 = "0.22"
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Reads the decode modules' own AST for the provider surface map: which wire
# fields does Comet actually name? A regex over the same source was wrong in
# both directions, counting any Rust field name and missing `serde(rename)`.
# Test-only on purpose - nothing on the runtime path parses Rust.
syn = { version = "2", features = ["full", "parsing", "extra-traits", "visit"] }

# Scripted fake CLIs for the adapter integration suites, spawned through
# `CARGO_BIN_EXE_*`. Rust rather than shell scripts so they are spawnable on
# Windows too — `CreateProcess` rejects a `#!/bin/sh` file (os error 193).
[[bin]]
name = "fake-claude"
path = "tests/fixtures/fake_claude.rs"

[[bin]]
name = "fake-codex"
path = "tests/fixtures/fake_codex.rs"

[[bin]]
name = "fake-claude-bad-discovery"
path = "tests/fixtures/fake_claude_bad_discovery.rs"

[[bin]]
name = "fake-codex-bad-discovery"
path = "tests/fixtures/fake_codex_bad_discovery.rs"

[[bin]]
name = "fake-codex-stuck-cursor"
path = "tests/fixtures/fake_codex_stuck_cursor.rs"

[[bin]]
name = "fake-codex-endless-cursor"
path = "tests/fixtures/fake_codex_endless_cursor.rs"
