[package]
name = "comet-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comet-proto.workspace = true
base64 = "0.22"
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Dev-only, and deliberately a cycle: comet-capture depends on comet-harness
# normally (it reaches into harness internals to build launches), while five of
# harness's own #[cfg(test)] unit tests — in claude::{commands,discovery,wire,
# normalize} and codex::discovery — read a promoted frame back out of the corpus
# via comet_capture::corpus_frame. Cargo permits a dev-dependency cycle; see D87.
#
# This reaches the [[bin]] targets below only in the sense that it does NOT:
# Cargo never links a [[bin]] target's dev-dependencies, in any build mode, so
# tests/fixtures/fake_claude.rs cannot `use comet_capture` and reads its one
# frame through a local copy of the convention instead. See that file.
comet-capture.workspace = true

# Scripted fake CLIs for the adapter integration suites, spawned through
# `CARGO_BIN_EXE_*`. Rust rather than shell scripts so they are spawnable on
# Windows too — `CreateProcess` rejects a `#!/bin/sh` file (os error 193).
[[bin]]
name = "fake-acp"
path = "tests/fixtures/fake_acp.rs"

[[bin]]
name = "fake-claude"
path = "tests/fixtures/fake_claude.rs"

[[bin]]
name = "fake-codex"
path = "tests/fixtures/fake_codex.rs"

[[bin]]
name = "fake-codex-init-stall"
path = "tests/fixtures/fake_codex_init_stall.rs"

[[bin]]
name = "fake-codex-init-crash"
path = "tests/fixtures/fake_codex_init_crash.rs"

[[bin]]
name = "fake-claude-bad-discovery"
path = "tests/fixtures/fake_claude_bad_discovery.rs"

[[bin]]
name = "fake-codex-bad-discovery"
path = "tests/fixtures/fake_codex_bad_discovery.rs"

[[bin]]
name = "fake-codex-stuck-cursor"
path = "tests/fixtures/fake_codex_stuck_cursor.rs"

[[bin]]
name = "fake-codex-endless-cursor"
path = "tests/fixtures/fake_codex_endless_cursor.rs"

[[bin]]
name = "fake-claude-discovery-stall"
path = "tests/fixtures/fake_claude_discovery_stall.rs"
