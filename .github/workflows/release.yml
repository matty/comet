name: nightly release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: wait for 30 minutes of silence
        if: github.event_name == 'push'
        run: sleep 1800
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: derive immutable nightly version
        id: release
        shell: bash
        run: |
          git fetch origin main
          source_sha="$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = push ] && [ "$source_sha" != "$GITHUB_SHA" ]; then
            echo "main advanced from $GITHUB_SHA to $source_sha" >&2
            exit 1
          fi
          base="$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$base"
          version="$base-nightly.$(date -u +%Y%m%d).${{ github.run_number }}.g${source_sha:0:7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake
      - name: set nightly workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("Cargo.toml")
          text = path.read_text()
          updated, count = re.subn(
              r'^version = "[^"]+"',
              f'version = "{sys.argv[1]}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("workspace version was not found exactly once")
          path.write_text(updated)
          PY
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: set nightly workspace version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("Cargo.toml")
          text = path.read_text()
          updated, count = re.subn(
              r'^version = "[^"]+"',
              f'version = "{sys.argv[1]}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("workspace version was not found exactly once")
          path.write_text(updated)
          PY
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: package dmg
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: set nightly workspace version
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $content = Get-Content -Raw Cargo.toml
          $updated = [regex]::Replace($content, '(?m)^version = "[^"]+"', "version = `"$env:VERSION`"", 1)
          if ($updated -eq $content) { throw "workspace version was not replaced" }
          Set-Content -Path Cargo.toml -Value $updated -NoNewline
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: build and package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo build --release -p comet
          $stage = Join-Path $env:RUNNER_TEMP "comet-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/comet.exe, README.md, LICENSE $stage
          New-Item -ItemType Directory -Force target/package | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "target/package/comet-$env:VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: target/package/*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: require release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "dist/comet-$VERSION-linux-x86_64.tar.gz"
          test -f "dist/comet-$VERSION-linux-aarch64.tar.gz"
          test -f "dist/comet-$VERSION-windows-x86_64.zip"
      - name: reject an existing tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "tag $TAG already exists" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Comet ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: Built from `${{ needs.prepare.outputs.source_sha }}` on `main`.
          files: dist/*
          fail_on_unmatched_files: true
